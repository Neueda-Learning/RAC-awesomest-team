spring.datasource.url=jdbc:mysql://localhost:3306/transaction_monitoring?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=appuser
spring.datasource.password=apppass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.main.register-shutdown-hook=true
app.service-name=Transaction Monitoring Service
app.version=1.0.0
spring.main.banner-mode=off

# HIGH-severity alert email notification. Keep secrets in environment variables.
app.alert.email.enabled=${ALERT_EMAIL_ENABLED:false}
app.alert.email.from=${ALERT_EMAIL_FROM:}
app.alert.email.to=${ALERT_EMAIL_TO:}
app.alert.email.max-attempts=${ALERT_EMAIL_MAX_ATTEMPTS:3}
app.alert.email.retry-delay-ms=${ALERT_EMAIL_RETRY_DELAY_MS:60000}
app.alert.email.retry-scan-ms=5000
app.alert.email.smtp-host=${SMTP_HOST:localhost}
app.alert.email.smtp-port=${SMTP_PORT:25}
app.alert.email.smtp-username=${SMTP_USERNAME:}
app.alert.email.smtp-auth=${SMTP_AUTH:false}
app.alert.email.starttls-enabled=${SMTP_STARTTLS_ENABLE:false}
app.alert.email.starttls-required=${SMTP_STARTTLS_REQUIRED:false}

# The built-in indicator reads static spring.mail values, while effective
# settings are database-backed and runtime-editable. Use Send Test Email in the
# dashboard to verify the effective SMTP configuration.
management.health.mail.enabled=false

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000
